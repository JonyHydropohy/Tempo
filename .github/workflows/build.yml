name: Build Tempo APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        continue-on-error: true

            - name: Locate project
        run: |
          echo "Searching for Gradle files..."
          find . -type f \( -name gradlew -o -name settings.gradle -o -name settings.gradle.kts \)

      - name: Build APK
        run: |
          WRAPPER=$(find . -type f -name gradlew | head -n 1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Build APK
        run: |
          chmod +x TempoAndroid-project\(4\)/TempoAndroid/gradlew 2>/dev/null || true
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "TempoAndroid-project(4)/TempoAndroid/gradlew" ]; then
            cd "TempoAndroid-project(4)/TempoAndroid"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found. Check project location."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tempo-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
